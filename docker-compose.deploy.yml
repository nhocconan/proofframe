# Public test site behind the host's Traefik (network `balancer`, ACME resolver `myresolver`).
# Only the web UI is routed; the API stays on the internal network + loopback.
# Requires .env (gitignored): PROOFFRAME_API_TOKEN, PROOFFRAME_BASIC_AUTH_USERS (htpasswd -nbB, single-quoted).
# Usage: docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build db api worker web
services:
  web:
    networks: [default, balancer]
    labels:
      traefik.enable: "true"
      traefik.docker.network: balancer
      traefik.http.routers.proofframe.rule: Host(`test-proof-frame.dic.app`)
      traefik.http.routers.proofframe.entrypoints: websecure
      traefik.http.routers.proofframe.tls.certresolver: myresolver
      traefik.http.routers.proofframe.middlewares: proofframe-auth
      traefik.http.middlewares.proofframe-auth.basicauth.users: ${PROOFFRAME_BASIC_AUTH_USERS:?set PROOFFRAME_BASIC_AUTH_USERS in .env}
      traefik.http.services.proofframe.loadbalancer.server.port: "3000"

networks:
  balancer:
    external: true
